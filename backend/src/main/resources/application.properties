spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=6h

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

youtube.api.key=${YOUTUBE_API_KEY:}
chzzk.client.id=${CHZZK_CLIENT_ID:}
chzzk.client.secret=${CHZZK_CLIENT_SECRET:}
chzzk.nid.aut=${CHZZK_NID_AUT:}
chzzk.nid.ses=${CHZZK_NID_SES:}
chzzk.live.enabled=${CHZZK_LIVE_ENABLED:true}
chzzk.chat.enabled=${CHZZK_CHAT_ENABLED:true}

app.admin.api-key=${ADMIN_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://dokhub.site,https://dokhub-love-doksaem.netlify.app}

# 클릭 분석 스냅샷은 30초 뒤 시작해 5분마다 다시 계산합니다.
analytics.clicks.initial-delay-ms=${CLICK_ANALYTICS_INITIAL_DELAY_MS:30000}
analytics.clicks.refresh-ms=${CLICK_ANALYTICS_REFRESH_MS:300000}
