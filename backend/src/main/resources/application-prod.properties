server.port=${PORT:8080}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=128,expireAfterWrite=6h

# Keep concurrent work within the free instance memory budget.
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

youtube.api.key=${YOUTUBE_API_KEY}

# chzzk API
chzzk.client.id=${CHZZK_CLIENT_ID:}
chzzk.client.secret=${CHZZK_CLIENT_SECRET:}
chzzk.nid.aut=${CHZZK_NID_AUT:}
chzzk.nid.ses=${CHZZK_NID_SES:}
